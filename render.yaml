# Render Blueprint — creates the API service when you connect this repo
# (Render dashboard → New → Blueprint). Web is on Cloudflare Pages, DB on Neon.
# See docs/runbooks/deploy.md for the full setup walkthrough.
services:
  - type: web
    name: cnos-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    plan: free
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      # Real credential auth landed with Phase 1 (ADR-0006); the dev-token stub
      # is gone, so prod posture everywhere.
      - key: ENVIRONMENT
        value: prod
      - key: DATABASE_URL
        sync: false # the cnos_app (NOBYPASSRLS) Neon URL — never the owner role
      - key: MIGRATIONS_DATABASE_URL
        sync: false # the neondb_owner URL, used only for boot-time alembic DDL
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # JSON array with your Pages URL, e.g. ["https://<project>.pages.dev"]
