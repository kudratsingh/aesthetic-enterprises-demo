services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cnos
      POSTGRES_PASSWORD: cnos
      POSTGRES_DB: cnos
    ports:
      # Host port 5433 to avoid colliding with other local Postgres instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnos -d cnos"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
