[project]
name = "clinic-network-os-api"
version = "0.1.0"
description = "clinic-network-os API — royalty billing, KPI reporting, lot traceability"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "pyjwt>=2.8",
    "uuid6>=2025.0.1",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W", "C4", "RET", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["app", "tests", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
# One loop for the whole suite: the app's cached async engine pools connections,
# and per-test loops would strand them ("attached to a different loop").
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: hits a real Postgres (docker-compose locally, service container in CI)",
]
